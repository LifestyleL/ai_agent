<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TypeScript HTML App</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
    }
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-wrap: wrap;
    }
    body > canvas:only-child {
      width: 100vw;
      height: 100vh;
    }
    /* 🌟 启动按钮样式 */
    #soundBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      padding: 12px 24px;
      background: #ff77aa;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    #soundBtn:hover {
      transform: scale(1.05);
    }
  </style>
  <!-- Live2DCubismCore script -->
  <script src = "./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script type="module" crossorigin src="/assets/index-CHbPzGPi.js"></script>
</head>
<body>
  <!-- 🌟 临时启动按钮：解决浏览器静音拦截 -->
  <button id="soundBtn">🎤 点击启动声音</button>
  
  <script>
    document.getElementById('soundBtn').addEventListener('click', function() {
      // 创建并唤醒 AudioContext，解锁浏览器限制
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      // 点完就消失
      this.style.display = 'none';
      console.log("🔊 声音权限已激活！现在去终端跟AI说话吧。");
    });
  </script>
</body>
</html>
